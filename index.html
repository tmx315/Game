        }

            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .game-card .tags {

            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;

            color: var(--gray);

            font-size: 0.8rem;

            color: #0288d1;

            background: #e8f5e9;

            color: #c2185b;
        }

        .tag.classic {
            background: #fff3e0;
            color: #ef6c00;
        }

        .game-card .btn {
            display: inline-block;
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            transition: background 0.3s ease;
            margin-top: auto;
        }

        .game-card .btn:hover {
            background: var(--primary-dark);
        }

            background: var(--pvz-color);
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            const gamesGrid = document.getElementById('games-grid');
            const categoryTabs = document.querySelectorAll('.category-tab');
            const searchBox = document.querySelector('.search-box');
            const gameCount = document.getElementById('game-count');
            
            // 更新游戏数量
            gameCount.textContent = games.length;
            
            // 渲染游戏卡片
            function renderGames(filteredGames = games) {
                gamesGrid.innerHTML = '';
                
                filteredGames.forEach(game => {
                    const gameCard = document.createElement('div');
                    gameCard.className = 'game-card';
                    gameCard.setAttribute('data-category', game.category);
                    
                    // 生成标签HTML
                    const tagsHTML = game.tags.map(tag => {
                        let tagClass = 'tag';
                        if (tag.includes('我的世界')) tagClass += ' mc';
                        else if (tag.includes('植物大战僵尸')) tagClass += ' pvz';
                        else if (['视觉', '3D', '粒子', '光线', '音频', '几何'].some(t => tag.includes(t))) tagClass += ' visual';
                        else if (['经典', '益智', '休闲', '策略', '棋类', '射击'].some(t => tag.includes(t))) tagClass += ' classic';
                        
                        return `<span class="${tagClass}">${tag}</span>`;
                    }).join('');
                    
                    // 确定按钮类名
                    let btnClass = 'btn';
                    if (game.category === 'mc') btnClass += ' mc';
                    else if (game.category === 'pvz') btnClass += ' pvz';
                    else if (game.category === 'visual') btnClass += ' visual';
                    else if (game.category === 'classic') btnClass += ' classic';
                    
                    gameCard.innerHTML = `
                        <div class="game-card-content">
                            <h3>${game.title}</h3>
                            <div class="tags">${tagsHTML}</div>
                            <p>${game.description}</p>
                            <a href="${game.url}" class="${btnClass}" target="_blank">开始游戏</a>
                        </div>
                    `;
                    
                    gamesGrid.appendChild(gameCard);
                });
            }
            
            // 初始渲染
            renderGames();
            
            // 分类筛选
            categoryTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const category = this.getAttribute('data-category');
                    
                    // 更新活跃标签
                    categoryTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 筛选游戏卡片
                    if (category === 'all') {
                        renderGames();
                    } else {
                        const filteredGames = games.filter(game => game.category === category);
                        renderGames(filteredGames);
                    }
                });
            });
            
            // 搜索功能
            searchBox.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                
                if (searchTerm === '') {
                    const activeCategory = document.querySelector('.category-tab.active').getAttribute('data-category');
                    if (activeCategory === 'all') {
                        renderGames();
                    } else {
                        const filteredGames = games.filter(game => game.category === activeCategory);
                        renderGames(filteredGames);
                    }
                    return;
                }
                
                const filteredGames = games.filter(game => 
                    game.title.toLowerCase().includes(searchTerm) || 
                    game.description.toLowerCase().includes(searchTerm) ||
                    game.tags.some(tag => tag.toLowerCase().includes(searchTerm))
                );
                
                renderGames(filteredGames);
            });
        });
    </script>
